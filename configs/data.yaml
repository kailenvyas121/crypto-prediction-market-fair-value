# Data pull configuration. All times UTC. Edit here, not in code.

study:
  start: "2025-11-01"   # first contract close included in the study
  end: "2026-10-28"     # last contract close included (exclusive)
  warmup_days: 35       # extra spot/vol history before `start` (HAR needs a 168h lag)

kalshi:
  base_url: "https://api.elections.kalshi.com/trade-api/v2"
  requests_per_second: 18     # used when signed; unauthenticated is capped at 4.5 (measured ~5)
  workers: 6
  series:
    KXBTCD:                   # hourly / daily / weekly above-below ladders
      cadences: [hourly, daily]
      # Keep strikes within ±band of the previous hourly settlement. That value is
      # known when the event opens, so strike selection has no look-ahead.
      strike_band_pct: 1.5
      candle_minutes: 1
    KXBTC15M:                 # 15-minute up/down, one market per event
      cadences: [fifteen_min]
      candle_minutes: 1

spot:
  coinbase:
    product: "BTC-USD"
    granularity: "ONE_MINUTE"
    requests_per_second: 8
  bitstamp:
    pair: "btcusd"
    step_seconds: 60
    requests_per_second: 4
  binance_vision:
    base_url: "https://data.binance.vision/data"
    klines_1m: ["spot/BTCUSDT", "futures/um/BTCUSDT"]   # whole study window
    klines_1s_days: 60          # last N days of 1-second spot klines (settlement-minute work)
    funding: "futures/um/BTCUSDT"

deribit:
  base_url: "https://www.deribit.com/api/v2"
  dvol_currency: "BTC"
  dvol_resolutions_seconds: [60, 3600]   # Deribit keeps ~6 months of 1-minute DVOL; hourly covers the full window
  requests_per_second: 5
