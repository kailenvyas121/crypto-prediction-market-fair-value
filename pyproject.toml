[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinpricer"
version = "0.1.0"
description = "Fair value and market making for crypto prediction markets"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.12",
    "requests>=2.31",
    "certifi",
    "pyyaml>=6",
    "tqdm>=4.66",
    "cryptography>=42",  # optional Kalshi request signing
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
